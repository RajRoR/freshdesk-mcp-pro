[project]
name = "freshdesk-mcp-pro"
version = "1.3.0"
description = "Freshdesk MCP server (pro fork): adds get_ticket_full, download_ticket_attachments, extract_inline_images, multi-account creds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "mcp[cli]>=1.3.0",
    "pydantic>=2.10.6",
]

[[project.authors]]
name = "Raj Ayyangar"
email = "raj@sycamoreinformatics.com"

[[project.authors]]
name = "Gopi Krishnan"
email = "gopi@effy.co.in"

[[project.authors]]
name = "Maanaesh Swamy"
email = "maanaesh.s@effy.co.in"

[project.urls]
Homepage = "https://github.com/RajRoR/freshdesk-mcp-pro"
Upstream = "https://github.com/effytech/freshdesk_mcp"

[build-system]
requires = [ "hatchling", "setuptools", "wheel"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/freshdesk_mcp", "README.md", "LICENSE", "pyproject.toml"]

[project.scripts]
freshdesk-mcp-pro = "freshdesk_mcp.server:main"
freshdesk-mcp = "freshdesk_mcp.server:main"
